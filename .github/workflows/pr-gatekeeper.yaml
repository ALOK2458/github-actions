name: PR Gatekeeper

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Print target branch
        run: echo "PR is being merged into branch: ${{ github.base_ref }}"

      - name: Print PR number
        run: echo "PR Number: ${{ github.event.pull_request.number }}"

      - name: Completion message
        run: echo "Gatekeeper checks complete"
